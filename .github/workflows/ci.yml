name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything. Without this block the job inherits the repository
# default, which on many repositories is read/write — a write-scoped token handed to every
# third-party action in the job for no reason any step here needs.
permissions:
  contents: read

jobs:
  test:
    # ubuntu, and that is the point of the job rather than an arbitrary default. The
    # .gitattributes rule marks examples/** as binary because CsvFileBackend writes CRLF on
    # every platform and tests/test_storage_contract.py compares those bytes exactly. Let
    # git normalise them and the suite passes on Windows and fails here — this is the run
    # that catches it, and Motrix Edge View vendors the same bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token is written into .git/config as an http.extraheader and stays
          # there for the rest of the job, readable by anything that runs afterwards.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # requirements-dev.txt pulls in all four optional extras (fastapi, pymodbus,
      # websocket-client, pyserial) on top of pytest, httpx and ruff. Without them the
      # connector tests that guard with pytest.importorskip would skip rather than run,
      # and CI would report green over four unexercised plugins.
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # check, not format. ruff.toml opens with "Lint only — `ruff format` is not part of
      # this project's workflow"; the source tree is tabs and deliberately unformatted, so a
      # format gate would fail 83 of 104 files on its first run.
      - run: ruff check .

      # No -m "not slow". The marker exists so a dev loop can skip the tests that spawn a
      # second interpreter; CI is the place that must not.
      - run: pytest
